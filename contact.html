<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <meta name="description" content="">
    <link rel="icon" href="image/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>

    <header class="header">
      <div class="container header__inner">
        <h1 class="header__title">
          <a class="header__link" href="index.html">My Work</a>
        </h1>
        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__card"><a class="header__link" href="about.html">About</a></li>
            <li class="header__card"><a class="header__link" href="works.html">Works</a></li>
            <li class="header__card"><a class="header__link" href="news.html">News</a></li>
            <li class="header__card"><a class="header__link" href="contact.html">Contact</a></li>
            <li class="header__card">
              <a class="header__link" href="https://www.instagram.com/">
                <img class="header__instagram" src="image/icon-instagram.png" alt="">
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

      <section class="contact section" id="contact">
        <div class="container contact__inner">
          <h2 class="contact__title title">Contact</h2>
          <form class="contact__form" action="#" method="post">
            <div class="contact__row">
              <label class="contact__label" for="contact-name">NAME</label>
              <input class="contact__input" type="text" id="contact-name" name="name">
            </div>
            <div class="contact__row">
              <label class="contact__label" for="contact-email">E-mail</label>
              <input class="contact__input" type="email" id="contact-email" name="email">
            </div>
            <div class="contact__row">
              <label class="contact__label" for="contact-message">MESSAGE</label>
              <textarea class="contact__textarea" id="contact-message" name="message" rows="6"></textarea>
            </div>
            <button class="contact__submit" type="submit">送信</button>
          </form>
        </div>
      </section>
      
    <footer class="footer">
      <div class="container">
        <p class="footer__copyright">&copy; 2020 My Work</p>
      </div>
    </footer>

  </body>
</html>
